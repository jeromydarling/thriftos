# Deploy ThriftOS to Cloudflare Workers.
#
# The order here is the point: check, then migrate, then deploy. A deploy that
# ships code needing a table the database hasn't got is an outage, and the
# cheapest place to catch a broken build is before anything reaches production.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN, with Workers Scripts
# Edit and D1 Edit on the account that owns the thriftos worker.
# CLOUDFLARE_ACCOUNT_ID is only required if the token can see more than one
# account; wrangler infers it otherwise.

name: Deploy

on:
  push:
    branches:
      - main
      # The branch the work currently lives on. Remove this once main is the
      # source of truth — until then, a push here is the only thing that ships.
      - claude/thrift-os-nri-mvp-y39204
  workflow_dispatch:

# One deploy at a time. Two overlapping pushes racing to wrangler deploy is
# how a worker ends up running the older of the two commits.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fail early if the token is missing
        # Without this, wrangler's failure is an authentication error forty
        # lines into a build log rather than a sentence at the top.
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Before the deploy, deliberately. Adding a column is safe against the
      # old code; the new code referencing a column that isn't there is not.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply thriftos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # After the deploy, because `wrangler secret put` needs the Worker to
      # exist. Each is skipped when its GitHub secret is unset, so this is a
      # no-op until you add them and never fails a deploy for being absent.
      #
      # Piped from an env var rather than passed as an argument: an argument
      # lands in the process list, and `secret put` reads stdin quietly. The
      # value is never echoed, and GitHub masks it in the log regardless.
      - name: Sync Stripe secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_CONNECT_WEBHOOK_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "· $name not set in GitHub secrets — leaving whatever the Worker has."
              continue
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
            echo "✓ $name synced."
          done

      - name: Check the deployed site answers
        # A green deploy step means the upload succeeded, not that the worker
        # runs. The shop page is in this list deliberately: the first deploy
        # had an APP_URL pointing at a hostname that didn't exist, which 404'd
        # every storefront while the marketing pages carried on answering 200.
        #
        # The base URL is read from the same APP_URL the worker uses, so this
        # check tests the value the app actually runs on rather than a second
        # copy of it that can drift.
        run: |
          base=$(node -e "
            const s = require('fs').readFileSync('wrangler.jsonc','utf8')
              .replace(/^\s*\/\/.*$/gm, '');
            process.stdout.write(JSON.parse(s).vars.APP_URL);
          ")
          echo "Checking $base"
          fail=0
          for path in / /pricing /help /second-chances; do
            # Cache-bust. Shop pages are edge-cached for two minutes, so a
            # check running seconds after the deploy will otherwise be answered
            # by the *previous* version — which is how a build that had
            # actually fixed the 404 still reported one.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'Cache-Control: no-cache' "$base$path?deploy=${GITHUB_SHA}" || echo "000")
            echo "$path → $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
