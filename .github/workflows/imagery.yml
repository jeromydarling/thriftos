# Draw the homepage photography, once, and commit it.
#
# Run by hand — this is not part of the build and not part of a deploy. The
# images are static files; the site never asks a model to draw them.
#
# It runs here rather than on a laptop only because this is where the
# Cloudflare token lives. The token needs Workers AI read/write in addition to
# what the deploy uses; without it the run fails with a permissions error from
# Cloudflare naming exactly what's missing.

name: Imagery

on:
  workflow_dispatch:
    inputs:
      shots:
        description: >-
          Space-separated shot ids to redraw (e.g. "rail counter"). Leave empty
          to draw only the ones that don't exist yet.
        required: false
        default: ""

  # Also on a change to the prompts themselves, because workflow_dispatch is
  # only offered for workflows that exist on the default branch and this one
  # doesn't yet. Cheap: a shot that already exists is skipped, so this is a
  # no-op unless a shot is genuinely missing. To *redraw* one, delete its file
  # or run this by hand with its id.
  push:
    branches:
      - main
      - claude/thrift-os-nri-mvp-y39204
    paths:
      - app/content/imagery.ts
      - scripts/generate-imagery.mjs
      - .github/workflows/imagery.yml

concurrency:
  group: imagery
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw
        run: node scripts/generate-imagery.mjs ${{ inputs.shots }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit whatever was drawn
        run: |
          if [ -z "$(git status --porcelain public/img)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add public/img
          git commit -m "Draw homepage photography${SHOTS:+ ($SHOTS)}

          Generated with FLUX.2 on Workers AI from the prompts in
          app/content/imagery.ts. Committed rather than rendered per request:
          a marketing page that redraws its own photographs costs money on
          every visit and can quietly change what it shows."
          git push origin HEAD:${{ github.ref_name }}
        env:
          SHOTS: ${{ inputs.shots }}
