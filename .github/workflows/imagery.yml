# Draw the project's photography, once, and commit it.
#
# Two sets. `site` is the marketing photography. `demo` is the demo shop's
# stock, drawn deliberately badly — cluttered, crooked, badly lit — because it
# is the *input* to the photo cleanup, and a cleanup shown against studio
# photography demonstrates nothing.
#
# Run by hand — this is not part of the build and not part of a deploy. The
# images are static files; nothing asks a model to draw them at request time.
#
# It runs here rather than on a laptop only because this is where the
# Cloudflare token lives. The token needs Workers AI read/write in addition to
# what the deploy uses; without it the run fails with a permissions error from
# Cloudflare naming exactly what's missing.

name: Imagery

on:
  workflow_dispatch:
    inputs:
      set:
        description: Which set to draw.
        required: false
        default: both
        type: choice
        options: [both, site, demo]
      shots:
        description: >-
          Space-separated shot ids to redraw (e.g. "rail counter"). Only
          meaningful with a single set. Leave empty to draw only the ones that
          don't exist yet.
        required: false
        default: ""

  # Also on a change to the prompts themselves, because workflow_dispatch is
  # only offered for workflows that exist on the default branch and this one
  # doesn't yet. Cheap: a shot that already exists is skipped, so this is a
  # no-op unless a shot is genuinely missing. To *redraw* one, delete its file
  # or run this by hand with its id.
  push:
    branches:
      - main
      - claude/thrift-os-nri-mvp-y39204
    paths:
      - app/content/imagery.ts
      - app/content/demo-photos.ts
      - scripts/generate-imagery.mjs
      - .github/workflows/imagery.yml

# A newer push supersedes an in-flight draw. Safe because a shot that already
# exists is skipped, so the replacement run picks up exactly what's missing —
# and it means a stuck request can be cleared by pushing rather than waited out.
concurrency:
  group: imagery
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The script imports sharp to compress what the model returns. This
      # workflow used to install nothing, which was fine while the script
      # shelled out to a tool that might be on the runner and is not fine now
      # that it depends on something real.
      - run: npm ci

      # Which token is this, and what is it allowed to do?
      #
      # Nobody remembers creating it, and Cloudflare's own answer to a token
      # without a permission is a bare "Authentication error" that names
      # neither the token nor what it was missing. This prints the token's
      # name, its id, and its permission groups — enough to find it in the
      # dashboard — and no part of the credential itself.
      - name: Identify the token
        continue-on-error: true
        run: node scripts/token-info.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Each set runs as its own step so one set failing still leaves the
      # other's images to be committed below.
      - name: Draw the site photography
        if: inputs.set == '' || inputs.set == 'both' || inputs.set == 'site'
        continue-on-error: true
        run: node scripts/generate-imagery.mjs --set=site ${{ inputs.shots }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Draw the demo shop's stock
        if: inputs.set == '' || inputs.set == 'both' || inputs.set == 'demo'
        continue-on-error: true
        run: node scripts/generate-imagery.mjs --set=demo ${{ inputs.shots }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runs even when drawing failed: five good images and one timeout should
      # keep the five. Without this a single stuck request throws away the
      # whole run's work, which is exactly what happened the first time.
      - name: Commit whatever was drawn
        if: always()
        run: |
          if [ -z "$(git status --porcelain public/img)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add public/img
          git commit -m "Draw photography${SHOTS:+ ($SHOTS)}

          Generated with FLUX.2 on Workers AI from the prompts in
          app/content/. Committed rather than rendered per request: a page
          that redraws its own photographs costs money on every visit and can
          quietly change what it shows.

          The demo set is deliberately unflattering. Those are back-room
          snapshots, and they are the input to the cleanup rather than a
          showcase of it."
          git push origin HEAD:${{ github.ref_name }}
        env:
          SHOTS: ${{ inputs.shots }}
